# Hardened nginx configuration — TLS terminated by Cloudflare Tunnel (cloudflared)
# nginx only listens on localhost:80; nothing is exposed directly to the internet.
# Validate with: docker compose run --rm --no-deps web nginx -t

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  server_tokens off;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Map for WebSocket upgrade (used by the ASF-ui log stream at /Api/NLog)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # --- Real visitor IP ---
  # cloudflared reaches nginx through Docker's port mapping, so every connection
  # arrives from the bridge gateway (172.x) or loopback. Trust CF-Connecting-IP
  # from those peers only: $remote_addr then becomes the real visitor IP for
  # logs, rate limiting and the X-Real-IP / X-Forwarded-For sent to asf and bin.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header   CF-Connecting-IP;

  access_log /var/log/nginx/access.log combined buffer=512k flush=1m;
  error_log  /var/log/nginx/error.log warn;

  # Rate limit per real visitor IP (see real_ip above).
  limit_req_zone  $binary_remote_addr zone=per_ip:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # --- Slowloris / oversized request mitigations ---
  client_body_timeout   10s;
  client_header_timeout 10s;
  keepalive_timeout     65s;
  send_timeout          10s;
  client_max_body_size  1m;
  client_body_buffer_size 128k;
  large_client_header_buffers 4 8k;

  # Redirects keep the path relative, so they don't point at http:// (nginx only
  # sees plain HTTP from the tunnel).
  absolute_redirect off;

  # Compress text on the tunnel hop too (Cloudflare re-compresses to browsers).
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
             application/xml image/svg+xml;

  # --- Per-path Cache-Control (see security-headers.conf for why these are maps) ---
  # Keyed on "$status:$uri" so long-lived caching only ever applies to successful
  # responses. An immutable 404 would otherwise stick at Cloudflare's edge.
  map "$status:$uri" $root_cache_control {
    "~^(?:200|304):.*\.(?:css|js|woff2?|ttf|otf|eot|svg|ico|png|jpe?g|webp|gif|avif)$"
                "public, max-age=31536000, immutable";
    default     "no-cache";
  }
  # cs2: archive names are unique and never rewritten, so cache them forever; the
  # /files/ JSON listing is always fresh; the non-hashed UI files revalidate.
  map "$status:$uri" $cs2_cache_control {
    "~^[0-9]+:/files/$"                "no-store";
    # (/downloads/ is the internal URI after the NAME.zip try_files below.)
    "~^(?:200|206|304):/(?:files|downloads)/[^/]+$"  "public, max-age=31536000, immutable";
    default                            "no-cache";
  }
  # bin: Vite's hashed /assets/ are immutable; the SPA shell revalidates; the /v1
  # API is left to the app ("" = no header).
  map "$status:$uri" $bin_cache_control {
    "~^(?:200|304):/assets/"  "public, max-age=31536000, immutable";
    "~^[0-9]+:/v1/"           "";
    default                   "no-cache";
  }

  # Unknown Host headers get dropped instead of falling through to the main site.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    # Docker restricts this to 127.0.0.1 on the host via the port binding in compose
    listen 80;
    server_name laine.lol www.laine.lol;

    root /usr/share/nginx/html;
    index index.html;

    # --- Rate limiting ---
    limit_req  zone=per_ip burst=40 nodelay;
    limit_conn conn_per_ip 20;

    # --- Security + cache headers (no add_header in any location below) ---
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      always;
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;
    add_header Cache-Control $root_cache_control always;

    # --- Deny hidden files (.git, .env, .htaccess, etc.) ---
    location ~ /\. {
      deny all;
      return 404;
    }

    # --- Deny backup and source files ---
    location ~* \.(bak|conf|dist|fla|inc|ini|log|psd|sh|sql|swp|tar|gz|zip)$ {
      deny all;
      return 404;
    }

    # --- Static assets: skip access logging (caching is set by the map above) ---
    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|webp|gif|avif)$ {
      access_log off;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    error_page 400 401 403 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html { internal; }
    location = /50x.html { internal; }
  }

  # --- ArchiSteamFarm IPC web UI (asf.laine.lol) ---
  # Proxies to the ASF container over the compose network. The variable
  # proxy_pass + docker resolver lets nginx start even if asf isn't up yet
  # and re-resolves the container IP after restarts.
  server {
    listen 80;
    server_name asf.laine.lol;

    # Docker's embedded DNS resolver for runtime container name resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ASF-ui can upload bot config files; allow a larger body than the main site
    client_max_body_size 16m;

    # Rate limiting (shares the zones defined for the main site)
    limit_req  zone=per_ip burst=40 nodelay;
    limit_conn conn_per_ip 20;

    # Baseline headers (incl. X-Frame-Options DENY: this is an admin panel). ASF-ui
    # needs its own script/style setup, so the CSP only forbids framing.
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    # Both locations send the real visitor IP ($remote_addr, see real_ip above) as
    # X-Forwarded-For, which ASF trusts from the compose network for its IPC ban
    # logic (asf-config/IPC.config).

    # WebSocket endpoint for the live log stream
    location ~* /Api/NLog {
      set $asf_upstream http://asf:1242;
      proxy_pass $asf_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Upgrade $http_upgrade;
      proxy_read_timeout 1h;
    }

    location / {
      set $asf_upstream http://asf:1242;
      proxy_pass $asf_upstream;

      # Recolor the ASF-ui accent to #C77F81. The accent is the --color-theme
      # custom property (+ dark/light shades); we can't edit the prebuilt SPA, so
      # inject a CSS override into its HTML. Forcing the vars on every element via
      # !important beats ASF's built-in theme palette. Accept-Encoding "" disables
      # upstream gzip so sub_filter can match the markup (nginx gzips the result);
      # sub_filter_types defaults to text/html, so the JS bundle (and its SRI hash)
      # is untouched.
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";
      sub_filter '</head>' '<style>*{--color-theme:#c77f81!important;--color-theme-dark:#a3686a!important;--color-theme-light:#d8a5a7!important}</style></head>';
      sub_filter_once on;
    }
  }

  # --- Rustybin pastebin (bin.laine.lol) ---
  # Proxies to the rustybin container, which serves both the React SPA and the
  # /v1 API on port 3000. Variable proxy_pass + docker resolver lets nginx start
  # even if the bin container isn't up yet and re-resolve its IP after restarts.
  server {
    listen 80;
    server_name bin.laine.lol;

    # Docker's embedded DNS resolver for runtime container name resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Pastes can be sizeable; allow a larger body than the static site.
    client_max_body_size 5m;

    # Rate limiting (shares the zones defined for the main site). The app also
    # enforces its own per-IP API limits, keyed on the X-Real-IP sent below.
    limit_req  zone=per_ip burst=40 nodelay;
    limit_conn conn_per_ip 20;

    # Rustybin's SPA needs inline styles and web workers for syntax highlighting,
    # so the CSP only forbids framing/plugins rather than restricting scripts.
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Cache-Control $bin_cache_control always;

    location / {
      set $bin_upstream http://bin:3000;
      proxy_pass $bin_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # --- CS2 build archive (cs2.laine.lol) ---
  # Listing UI bind-mounted at /usr/share/nginx/cs2-site. The archived builds
  # (.7z; older ones may still be .zip) are written by the `watcher` service into
  # the shared cs2-data volume, mounted here read-only at /usr/share/nginx/cs2-data;
  # /files/ aliases its downloads/ subdir. The page fetches a JSON directory listing
  # from /files/ and renders download links, so new builds appear with no rebuild.
  server {
    listen 80;
    server_name cs2.laine.lol;

    root /usr/share/nginx/cs2-site;
    index index.html;

    # Serving large files efficiently is the whole point of this vhost.
    sendfile   on;
    tcp_nopush on;

    # Rate limiting (shares the zones defined for the main site).
    limit_req  zone=per_ip burst=40 nodelay;
    limit_conn conn_per_ip 20;

    # connect-src 'self' lets the page fetch its own /files/ JSON listing.
    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      always;
    add_header Cache-Control $cs2_cache_control always;

    # Deny hidden files (.NAME.part archives being written, .staging, .git, ...).
    # Regex wins over the /files/ prefix below but not over the exact = /files/.
    location ~ /\. {
      deny all;
      return 404;
    }

    # JSON directory listing of the files (exact match beats the prefix below).
    location = /files/ {
      alias /usr/share/nginx/cs2-data/downloads/;
      autoindex on;
      autoindex_format json;
    }

    # Old links to NAME.zip keep working after the .zip -> .7z recompression:
    # serve the zip while it still exists, otherwise redirect to NAME.7z.
    location ~ ^/files/(?<cs2_stem>[^/]+)\.zip$ {
      root /usr/share/nginx/cs2-data;
      try_files /downloads/$cs2_stem.zip @cs2_to_7z;
      aio threads;
    }
    location @cs2_to_7z {
      return 301 /files/$cs2_stem.7z;
    }

    # The actual archive downloads.
    location /files/ {
      alias /usr/share/nginx/cs2-data/downloads/;
      autoindex off;
      aio threads;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }

  # --- CS2 crosshair code converter (crosshair.laine.lol) ---
  # Static page bind-mounted at /usr/share/nginx/crosshair-site. Share codes are
  # decoded entirely client-side, so the page makes no requests (connect-src 'none').
  server {
    listen 80;
    server_name crosshair.laine.lol;

    root /usr/share/nginx/crosshair-site;
    index index.html;

    # Rate limiting (shares the zones defined for the main site).
    limit_req  zone=per_ip burst=40 nodelay;
    limit_conn conn_per_ip 20;

    include /etc/nginx/security-headers.conf;
    add_header Content-Security-Policy
      "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
      always;
    # Non-hashed UI files: make clients revalidate so redeploys show up at once.
    add_header Cache-Control "no-cache" always;

    location ~ /\. {
      deny all;
      return 404;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
