# Baseline security headers, included once per server block. Each vhost adds its
# own Content-Security-Policy next to the include.
#
# nginx gotcha: any add_header inside a location drops ALL server-level add_headers
# for that location. So locations here never use add_header; per-path
# Cache-Control comes from the maps in nginx.conf instead.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff"                                        always;
add_header X-Frame-Options           "DENY"                                           always;
add_header Referrer-Policy           "no-referrer"                                    always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
